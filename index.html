<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de publicaciones</title>
    <style>
        body { font-family: Arial; max-width: 640px; margin: 2rem auto; }
        form { display: grid; gap: .5rem; margin-bottom: 1rem; }
        .post { border: 1px solid #ddd; border-radius: 6px;
                padding: 0 1rem; margin: .5rem 0; }
        .nuevo { border-color: seagreen; background: #f0fff4; }
        .error { color: crimson; }
        /* Actividad 2 */
        .post h3 { cursor: pointer; }
        .post h3:hover { text-decoration: underline; }
        .comentarios { border-top: 1px dashed #bbb; margin-bottom: 1rem; padding-top: .5rem; }
        .comentario { background: #f7f7f7; border-radius: 4px;
                      padding: .3rem .7rem; margin: .4rem 0; font-size: .9rem; }
        .comentario small { color: #555; }
        /* Actividad 3 */
        small.error { min-height: 1em; }
        .ok { color: seagreen; }
        .fila { display: flex; gap: .5rem; flex-wrap: wrap; }
    </style>
</head>
<body>
    <h1>Gestor de publicaciones</h1>

    <h2>Listar (GET)</h2>
    <form id="form-buscar">
        <label>Usuario (1 a 10)
            <input type="number" id="input-usuario"
                   min="1" max="10" value="1">
        </label>
        <label>Cantidad de publicaciones
            <select id="select-limite">
                <option value="5" selected>5</option>
                <option value="10">10</option>
                <option value="20">20</option>
            </select>
        </label>
        <button type="submit">Listar publicaciones</button>
    </form>

    <label>Buscar por título
        <input type="text" id="input-busqueda" placeholder="Escriba para filtrar...">
    </label>

    <h2>Nueva publicación (POST)</h2>
    <form id="form-crear" novalidate>
        <input type="text" id="input-titulo" placeholder="Título (mínimo 5 caracteres)">
        <small id="error-titulo" class="error"></small>
        <textarea id="input-cuerpo" rows="3"
                  placeholder="Contenido"></textarea>
        <small id="error-cuerpo" class="error"></small>
        <button type="submit" id="btn-crear">Publicar</button>
    </form>

    <h2>Comentar una publicación (POST)</h2>
    <form id="form-comentar" novalidate>
        <input type="number" name="postId" min="1" max="100" value="1"
               placeholder="ID de la publicación">
        <input type="text" name="name" placeholder="Nombre">
        <input type="email" name="email" placeholder="Correo">
        <textarea name="body" rows="2" placeholder="Comentario"></textarea>
        <small id="error-comentario" class="error"></small>
        <button type="submit" id="btn-comentar">Comentar</button>
    </form>
    <p id="estado-comentario"></p>

    <p id="estado"></p>
    <section id="lista"></section>

    <script src="app.js"></script>
</body>
</html>
